    <!-- Perf: parallelize third-party origins.
         Preconnect ao host Supabase externo (real) evita pagar DNS+TLS na primeira
         chamada de auth/API, encurtando o TTFB do primeiro request em ~100-300ms. -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="dns-prefetch" href="https://syyxnqzxqabeuqbuptkh.supabase.co" />
    <link rel="preconnect" href="https://syyxnqzxqabeuqbuptkh.supabase.co" crossorigin />

    <!-- Non-blocking font load: paints with system fallback, swaps to Space Grotesk / DM Sans once ready -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Space+Grotesk:wght@500;600;700&family=DM+Sans:wght@400;500;600;700&display=swap"

      />
    </noscript>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.json" />

  <body>
    <!-- Loader inicial: CSS inline, independente do bundle e do CSS do app.
         Garante que nunca exista uma tela totalmente branca durante o boot. -->
    <style>
      #app-boot {
        position: fixed; inset: 0; display: flex; flex-direction: column;
        align-items: center; justify-content: center; gap: 16px;
        background: #ffffff; color: #15181D;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        z-index: 2147483000;
      }
      @media (prefers-color-scheme: dark) {
        #app-boot { background: #15181D; color: #F8FAFC; }
      }
      html[data-app-mounted="true"] #app-boot { display: none; }
      #app-boot .boot-name { font-size: 20px; font-weight: 700; letter-spacing: .5px; }
      #app-boot .boot-spinner {
        width: 28px; height: 28px; border-radius: 50%;
        border: 3px solid currentColor; border-top-color: transparent;
        opacity: .5; animation: boot-spin .8s linear infinite;
      }
      @keyframes boot-spin { to { transform: rotate(360deg); } }
      #app-boot .boot-recovery { display: none; max-width: 340px; text-align: center; padding: 0 24px; }
      #app-boot[data-state="recovery"] .boot-spinner { display: none; }
      #app-boot[data-state="recovery"] .boot-recovery { display: block; }
      #app-boot .boot-msg { font-size: 14px; opacity: .75; margin: 8px 0 16px; line-height: 1.45; }
      #app-boot button {
        display: block; width: 100%; margin: 8px 0; padding: 11px 16px;
        border-radius: 10px; font-size: 14px; font-weight: 600; cursor: pointer;
        border: 1px solid rgba(127,127,127,.35); background: transparent; color: inherit;
      }
      #app-boot button.primary { background: #2563EB; border-color: #2563EB; color: #fff; }
    </style>

    <div id="app-boot" data-state="loading" role="status" aria-live="polite">
      <div class="boot-name">EmprestAI</div>
      <div class="boot-spinner"></div>
      <div class="boot-recovery">
        <div style="font-size:16px;font-weight:600">Não foi possível abrir o aplicativo</div>
        <p class="boot-msg">Uma atualização ou falha temporária impediu o carregamento. Sua sessão continua salva.</p>
        <button type="button" class="primary" id="boot-reload">Recarregar aplicativo</button>
        <button type="button" id="boot-clear">Limpar cache temporário e recarregar</button>
      </div>
    </div>

    <!-- Bootstrap de recuperação: roda ANTES do React e não depende dele.
         Se o bundle principal falhar ou o app não montar em 10s, mostra a
         tela de recuperação em vez de deixar a tela branca. -->
    <script>
      (function () {
        var APP_CACHE_PREFIX = "emprestai-pwa-";
        var boot = document.getElementById("app-boot");
        var done = false;
        var timer = null;

        function finish() {
          done = true;
          if (timer) clearTimeout(timer);
          if (boot && boot.parentNode) boot.parentNode.removeChild(boot);
        }
        window.__APP_BOOT_OK__ = finish;

        function showRecovery() {
  if (done || !boot) return;
  boot.setAttribute("data-state", "recovery");
  // Tenta limpar caches e recarregar apenas uma vez
  if (!window.__APP_AUTO_RELOAD_ATTEMPT__) {
    window.__APP_AUTO_RELOAD_ATTEMPT__ = true;
    setTimeout(() => {
      console.warn("Recuperação automática: limpando caches e recarregando a aplicação.");
      // Limpa Service Worker e caches antes de recarregar
      Promise.all([unregisterAppSW(), clearAppCaches()]).then(() => {
        reload();
      });
    }, 2000);
  }
}

        function isModuleError(msg) {
          msg = String(msg || "");
          return /Failed to fetch dynamically imported module|Importing a module script failed|Loading chunk|ChunkLoadError|Load failed|is not a valid JavaScript MIME type|module script/i.test(msg);
        }

        window.addEventListener("error", function (event) {
          if (done) return;
          var target = event.target;
          if (target && target.tagName === "SCRIPT") return showRecovery();
          if (isModuleError(event.message)) showRecovery();
        }, true);

        window.addEventListener("unhandledrejection", function (event) {
          if (done) return;
          var reason = event.reason;
          if (isModuleError(reason && reason.message ? reason.message : reason)) showRecovery();
        });

        // Watchdog: 10s sem montagem do React => tela de recuperação.
        timer = setTimeout(function () {
          if (done) return;
          if (window.__APP_MOUNTED__ === true) return finish();
          var root = document.getElementById("root");
          if (root && root.childElementCount > 0) return finish();
          showRecovery();
        }, 10000);

        function clearAppCaches() {
          if (!("caches" in window)) return Promise.resolve();
          return caches.keys().then(function (keys) {
            return Promise.all(
              keys
                .filter(function (k) { return k.indexOf(APP_CACHE_PREFIX) === 0; })
                .map(function (k) { return caches.delete(k); })
            );
          }).catch(function () {});
        }

        function unregisterAppSW() {
          if (!navigator.serviceWorker) return Promise.resolve();
          return navigator.serviceWorker.getRegistrations().then(function (regs) {
            return Promise.all(regs.map(function (r) {
              var url = (r.active && r.active.scriptURL) || "";
              return url.indexOf("sw-push") === -1 ? r.unregister() : null;
            }));
          }).catch(function () {});
        }

        function reload() {
          var url = new URL(window.location.href);
          url.searchParams.set("_r", String(Date.now()));
          window.location.replace(url.toString());
        }

        var reloadBtn = document.getElementById("boot-reload");
        var clearBtn = document.getElementById("boot-clear");
        if (reloadBtn) reloadBtn.addEventListener("click", reload);
        if (clearBtn) clearBtn.addEventListener("click", function () {
          // Preserva localStorage (sessão Supabase) e IndexedDB.
          unregisterAppSW().then(clearAppCaches).then(reload);
        });
      })();
    </script>

    <div id="root"></div>
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
